name: Refresh Proxy Pool

on:
  schedule:
    - cron: "17 */2 * * *"    # 每2小时(降低Upstash配额消耗)
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: true

permissions:
  issues: write   # 失败时自动建issue通知

env:
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # TEST_URL: https://你的真实目标站.com   # 取消注释可提升池子可用率

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Crawl & validate & push to Upstash
        run: python refresh.py

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 代理池刷新失败 #${context.runNumber}`,
              body: `运行日志: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
